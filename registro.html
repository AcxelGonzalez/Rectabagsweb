<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registra tu cuenta | Rectabags</title>

        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"/>

        <link rel="stylesheet" href="css/style_header_footer.css" />
        <link rel="stylesheet" href="css/style_login.css" />
    </head>
    <body>
        
        <!-- ================= HEADER / NAVBAR ================= -->
        <div id="header-container">
            <!-- El contenido del encabezado se insertará aquí -->
        </div>

        <!-- Se asume que el header ya está cargado arriba -->
        <section class="login-section d-flex align-items-center py-5">
            <div class="container">
                
                <!-- Títulos Superiores -->
                <div class="row mb-5 text-center">
                    <div class="col-12">
                        <!-- display-5 ajusta el tamaño, titulo-mono aplica la fuente tipo máquina de escribir del mockup -->
                        <h1 class="display-5 titulo-mono mb-2">El primer paso</h1>
                        <p class="fs-5 text-dark fw-light">Crea tu cuenta para poder comprar</p>
                    </div>
                </div>

                <!-- INICIO CONTENEDOR REGISTRO-->
            <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">
                <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4 bg-white">
                <div class="card-body p-0">
                    
                    <h2 class="titulo-mono h3 mb-4 text-start">REGISTRATE</h2>

                    <form id="form-registro">
                    
                    <!-- Correo -->
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Correo(*)</label>
                        <input type="email" class="form-control rounded-3 border-secondary-subtle py-2" id="email" required>
                    </div>

                    <!-- Nombre y Apellido -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                        <label for="nombre" class="form-label small fw-semibold">Nombre(*)</label>
                        <input type="text" class="form-control rounded-3 border-secondary-subtle py-2" id="nombre" required>
                        </div>
                        <div class="col-md-6">
                        <label for="apellido" class="form-label small fw-semibold">Apellido(*)</label>
                        <input type="text" class="form-control rounded-3 border-secondary-subtle py-2" id="apellido" required>
                        </div>
                    </div>

                    <!-- RUT y Teléfono -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="rut" class="form-label small fw-semibold">RUT(*)</label>
                            <input type="text" class="form-control rounded-3 border-secondary-subtle py-2" id="rut" placeholder="Ej: 12345678-9" required>
                        </div>
                        <div class="col-md-6">
                            <label for="telefono" class="form-label small fw-semibold">Teléfono(*)</label>
                            <input type="text" class="form-control rounded-3 border-secondary-subtle py-2" id="telefono" placeholder="+56 9 XXXX XXXX" required>
                        </div>
                    </div>

                    <!-- Contraseñas -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                        <label for="password" class="form-label small fw-semibold">Contraseña(*)</label>
                        <input type="password" class="form-control rounded-3 border-secondary-subtle py-2" id="password" required>
                        </div>
                        <div class="col-md-6">
                        <label for="confirm-password" class="form-label small fw-semibold">Repita contraseña(*)</label>
                        <input type="password" class="form-control rounded-3 border-secondary-subtle py-2" id="confirm-password" required>
                        </div>
                    </div>

                    <!-- Nota Aclaratoria -->
                    <div class="text-center border-top border-bottom border-warning-subtle py-2 mb-4">
                        <span class="small text-decoration-underline" style="color: #D9825B; font-size: 0.82rem;">
                        La información a continuación no es obligatoria. Al registrarla ahora no será necesario hacerlo en el Checkout.
                        </span>
                    </div>

                    <!-- Región y Comuna -->
                    <div class="row g-3 mb-3">

                        <div class="col-md-6">

                            <label
                                for="region"
                                class="form-label small fw-semibold">
                                Región
                            </label>

                            <select
                                class="form-select rounded-3 border-secondary-subtle py-2"
                                id="region">

                                <option value="">
                                    Selecciona una región
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6">

                            <label
                                for="comuna"
                                class="form-label small fw-semibold">
                                Comuna
                            </label>

                            <select
                                class="form-select rounded-3 border-secondary-subtle py-2"
                                id="comuna"
                                disabled>

                                <option value="">
                                    Selecciona una comuna
                                </option>

                            </select>

                        </div>

                    </div>

                    <!-- Dirección -->
                    <div class="mb-4">
                        <label for="direccion" class="form-label small fw-semibold">Dirección</label>
                        <input type="text" class="form-control rounded-3 border-secondary-subtle py-2" id="direccion">
                    </div>

                    <!-- Términos y Condiciones -->
                    <div class="form-check mb-4">
                        <input 
                            class="form-check-input border-dark rounded-1" 
                            type="checkbox" 
                            id="terminos" 
                            required
                            oninvalid="this.setCustomValidity('Debes aceptar los términos y condiciones para crear tu cuenta.')"
                            oninput="this.setCustomValidity('')"
                        >
                        <label class="form-check-label small" for="terminos">
                            Acepto <a href="terminos_registro.html" target="_blank" class="text-dark text-decoration-underline">términos y condiciones</a>(*)
                        </label>
                    </div>

                    <!-- Botón Submit Centrado -->
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-dark rounded-3 px-4 py-2 titulo-mono fs-6">
                        Crear cuenta
                        </button>
                    </div>

                    </form>
                </div>
                </div>
            </div>
            </div>

                <!-- Footer de inicio de sesión -->
                <div class="text-center mt-4">
                <p class="fw-bold text-secondary">
                    ¿Ya tienes una cuenta? | <a href="login.html" class="text-secondary text-decoration-none fw-normal">Inicia sesión aquí.</a>
                </p>
                </div>

            </div>
        </section>

        <!-- ================= FOOTER ================= -->
        <div id="footer-container">
            <!-- El contenido del pie de página se insertará aquí -->
        </div>

        <!--JavaScript de Bootstrap -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">           
        </script>  

        <script src="js/main.js"></script>
        <script src="js/auth.js"></script>

    </body>
</html>
