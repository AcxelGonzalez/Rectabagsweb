<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recuperar Contraseña | Rectabags</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"/>

        <link rel="stylesheet" href="css/style_header_footer.css" />
        <link rel="stylesheet" href="css/style_login.css" />
    </head>
    <body>
        
        <!-- ================= HEADER / NAVBAR ================= -->
        <div id="header-container">
            <!-- El contenido del encabezado se insertará dinámicamente -->
        </div>

        <section class="login-section d-flex align-items-center py-5">
            <div class="container">
                
                <!-- Títulos Superiores -->
                <div class="row mb-5 text-center">
                    <div class="col-12">
                        <h1 class="display-5 titulo-mono mb-2">Restablece tu acceso</h1>
                        <p class="fs-5 text-dark fw-light">Ingresa tus datos de verificación para actualizar tu contraseña</p>
                    </div>
                </div>

                <!-- CONTENEDOR RECUPERACIÓN -->
                <div class="row justify-content-center">
                    <div class="col-lg-6 col-md-8">
                        <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4 bg-white">
                            <div class="card-body p-0">
                                
                                <h2 class="titulo-mono h4 mb-3 text-start">RECUPERAR CONTRASEÑA</h2>
                                <p class="small text-secondary mb-4">
                                    Para verificar tu identidad, ingresa el correo registrado y tu RUT asociado a la cuenta.
                                </p>

                                <form id="form-recuperar">
                                    
                                    <!-- Correo -->
                                    <div class="mb-3">
                                        <label for="recuperar-email" class="form-label small fw-semibold">Correo registrado(*)</label>
                                        <input type="email" class="form-control rounded-3 border-secondary-subtle py-2" id="recuperar-email" autocomplete="email" required>
                                    </div>

                                    <!-- RUT -->
                                    <div class="mb-4">
                                        <label for="recuperar-rut" class="form-label small fw-semibold">RUT registrado(*)</label>
                                        <input type="text" class="form-control rounded-3 border-secondary-subtle py-2" id="recuperar-rut" placeholder="Ej: 12345678-9" required>
                                    </div>

                                    <!-- Nuevas Contraseñas -->
                                    <div class="row g-3 mb-4">
                                        <div class="col-md-6">
                                            <label for="nueva-pass" class="form-label small fw-semibold">Nueva contraseña(*)</label>
                                            <input type="password" class="form-control rounded-3 border-secondary-subtle py-2" id="nueva-pass" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="confirm-nueva-pass" class="form-label small fw-semibold">Repita nueva contraseña(*)</label>
                                            <input type="password" class="form-control rounded-3 border-secondary-subtle py-2" id="confirm-nueva-pass" required>
                                        </div>
                                    </div>

                                    <!-- Botón Submit Centrado -->
                                    <div class="text-center mt-4">
                                        <button type="submit" class="btn btn-dark rounded-3 px-4 py-2 titulo-mono fs-6 w-100">
                                            Actualizar Contraseña
                                        </button>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer de inicio de sesión -->
                <div class="text-center mt-4">
                    <p class="fw-bold text-secondary">
                        ¿Recordaste tu contraseña? | <a href="login.html" class="text-secondary text-decoration-none fw-normal">Inicia sesión aquí.</a>
                    </p>
                </div>

            </div>
        </section>

        <!-- ================= FOOTER ================= -->
        <div id="footer-container">
            <!-- El contenido del pie de página se insertará dinámicamente -->
        </div>

        <!-- JavaScript de Bootstrap -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">           
        </script>  

        <script src="js/main.js"></script>
        <script src="js/auth.js"></script>

    </body>
</html>
