<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ingresa a tu cuenta | Rectabags</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"/>

        <link rel="stylesheet" href="css/style_header_footer.css" />
        <link rel="stylesheet" href="css/style_login.css" />
    </head>
    <body>
        <!-- ================= HEADER / NAVBAR ================= -->
        <div id="header-container">
            <!-- El contenido del encabezado se insertará aquí -->
        </div>

        <!-- Se asume que el header ya está cargado arriba -->
        <section class="login-section d-flex align-items-center py-5">
            <div class="container">
                
                <!-- Títulos Superiores -->
                <div class="row mb-5 text-center">
                    <div class="col-12">
                        <!-- display-5 ajusta el tamaño, titulo-mono aplica la fuente tipo máquina de escribir del mockup -->
                        <h1 class="display-5 titulo-mono mb-2">Bienvenido a Rectabags</h1>
                        <p class="fs-5 text-dark fw-light">Ingresa o crea tu cuenta para poder comprar</p>
                    </div>
                </div>

                <!-- Contenedor de las dos tarjetas -->
                <!-- justify-content-center centra las cajas, g-4 da un espacio (gap) entre ellas en móviles -->
                <div class="row justify-content-center g-4">
                    
                    <!-- TARJETA IZQUIERDA: INGRESAR -->
                    <div class="col-md-5">
                        <!-- border-0 quita el borde por defecto de Bootstrap, shadow-sm da una sombra muy sutil, h-100 iguala la altura con la otra tarjeta -->
                        <div class="card border-0 shadow-sm h-100 p-4 rounded-0">
                            <div class="card-body">
                                <h2 class="text-center mb-4 titulo-mono">Ingresar</h2>
                                
                                <form id="form-login">
                                    <div class="mb-3">
                                        <label for="email" class="form-label small text-secondary">Correo electrónico</label>
                                        <!-- rounded-0 quita los bordes redondeados para que sea cuadrado como en el mockup -->
                                        <input type="email" class="form-control rounded-0 border-dark" id="email" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="password" class="form-label small text-secondary">Contraseña</label>
                                        <input type="password" class="form-control rounded-0 border-dark" id="password" required>
                                    </div>
                                    
                                    <!-- Opciones de contraseña y recordar -->
                                    <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input border-dark rounded-0" id="recordarme">
                                            <label class="form-check-label small" for="recordarme">Recuerdame</label>
                                        </div>
                                        <a href="#" class="small text-secondary text-decoration-underline">¿Olvidaste tu contraseña?</a>
                                    </div>
                                    
                                    <button type="submit" class="btn btn-dark w-100 rounded-0 py-2">Ingresar</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- TARJETA DERECHA: CREAR CUENTA -->
                    <div class="col-md-5">
                        <div class="card border-0 shadow-sm h-100 p-4 rounded-0">
                            <!-- flex-column permite empujar el botón al fondo si la tarjeta izquierda es más alta -->
                            <div class="card-body d-flex flex-column">
                                <h2 class="text-center mb-4 titulo-mono">Crear cuenta</h2>
                                
                                <!-- flex-grow-1 hace que este texto ocupe el espacio sobrante, empujando lo demás hacia abajo -->
                                <p class="texto-mono small flex-grow-1 text-secondary lh-lg">
                                    Al registrarte podrás comenzar a realizar tus compras, acceder al estado e historial de tus pedidos. Solo te pediremos lo esencial.
                                </p>
                                
                                <div class="mb-4">
                                    <a href="#" class="small text-secondary text-decoration-underline">Términos y condiciones.</a>
                                </div>
                                
                                <button type="button" class="btn btn-dark w-100 rounded-0 py-2 mt-auto" onclick="window.location.href='registro.html'">Crear cuenta</button>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </section>

        <!-- ================= FOOTER ================= -->
        <div id="footer-container">
            <!-- El contenido del pie de página se insertará aquí -->
        </div>

        <!--JavaScript de Bootstrap -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">
        </script>  

        <script src="js/main.js"></script>

        <!-- JavaScript para Login -->
        <script>
            document.getElementById('form-login').addEventListener('submit', function(e) {
                e.preventDefault();

                const emailInput = document.getElementById('email').value.trim();
                const passwordInput = document.getElementById('password').value;

                // 1. Obtener la lista de usuarios desde LocalStorage
                const usuarios = JSON.parse(localStorage.getItem('usuarios_rectabags')) || [];

                // 2. Buscar credenciales coincidentes
                const usuarioValido = usuarios.find(u => u.email === emailInput && u.password === passwordInput);

                if (usuarioValido) {
                    // 3. Guardar la sesión activa
                    const sesion = {
                        email: usuarioValido.email,
                        nombre: usuarioValido.nombre,
                        apellido: usuarioValido.apellido
                    };
                    
                    localStorage.setItem('usuario_sesion', JSON.stringify(sesion));

                    alert(`¡Bienvenido/a ${usuarioValido.nombre}!`);
                    window.location.href = 'home.html';
                } else {
                    alert('Correo o contraseña incorrectos.');
                }
            });
        </script>
    </body>
</html>
