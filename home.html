<!-- DEFENSA: <!doctype html> le dice al navegador que use el motor de renderizado moderno de HTML5. Si se omite, el navegador entra en 'Quirks Mode' y el diseño se rompe. -->
<!doctype html>
<!-- DEFENSA: lang="es" ayuda al SEO y a los lectores de pantalla para personas con discapacidad visual. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- DEFENSA: viewport ajusta el ancho de la página al ancho del dispositivo. Si se borra, en un celular la página se verá pequeñita como si fuera la vista de un monitor de PC. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rectabags | De ciclista para ciclistas</title>

    <!-- DEFENSA: CDN de Bootstrap. Nos ahorra descargar el CSS al proyecto. OJO: La versión 5.3.8 no es la última estable (es la 5.3.3). Si el menú de celular no abre, es por este parámetro. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"/>

    <link rel="stylesheet" href="css/style_header_footer.css" />
    <link rel="stylesheet" href="css/style_home.css" />
  </head>
  <body>

    <!-- ================= HEADER / NAVBAR ================= -->
    <div id="header-container"></div>

    <main>
      <!-- ================= HERO SECTION ================= -->
      <!-- DEFENSA: d-flex activa Flexbox. align-items-end empuja el contenido hacia abajo. Si pones 'align-items-center', el texto "La mochila perfecta" quedará en el medio de la imagen. -->
      <section class="hero-section d-flex align-items-end">
        <!-- DEFENSA: container centra el contenido y le da márgenes laterales. Si pones 'container-fluid', el texto se pegará a los bordes de la pantalla. -->
        <div class="container mb-5">
          <div class="hero-content text-white">
            <!-- DEFENSA: display-4 es una clase de tipografía de Bootstrap más grande que h1. fw-bold aplica negrita (font-weight: bold). -->
            <h2 class="display-4 fw-bold mb-1">La mochila perfecta</h2>
            <p class="fs-5">para viajar, trabajar y explorar</p>
          </div>
        </div>
      </section>

      <!-- ================= PRODUCTOS ================= -->
      <section class="productos-section py-5">
        <div class="container">
          <h2 class="text-center fw-bold mb-5 text-uppercase titulo-pesado">
            Explora nuestros productos
          </h2>

          <!-- DEFENSA: row crea una fila de grilla. text-md-start alinea el texto a la izquierda SOLO en PC. En celular hereda el text-center. -->
          <div class="row align-items-center text-center text-md-start">
            <div class="col-md-3 mb-4 mb-md-0">
              <!-- DEFENSA: lh-sm reduce el interlineado (line-height). Si lo quitas, las líneas del título quedarán más separadas. -->
              <h3 class="fw-bold text-uppercase titulo-pesado lh-sm">
                Selecciona el que mejor se ajuste a tus necesidades
              </h3>
            </div>
            
            <div class="col-md-7 mb-4 mb-md-0">
              <!-- DEFENSA: g-2 (gap) añade una separación de 8px entre las columnas. Si pones g-5, el espacio será enorme. -->
              <div class="row g-2">
                <!-- DEFENSA: ATENCIÓN AQUÍ. 'col-3' obliga a que siempre sean 4 fotos por fila (12/3=4). En celular esto se verá diminuto. Para hacerlo responsivo, deberías cambiarlo a 'col-6 col-md-3'. -->
                <div class="col-3">
                    <!-- DEFENSA: img-fluid asegura que la imagen no se salga de su caja. object-fit-cover recorta la imagen sin deformarla. -->
                    <img src="img/HOME/image 7.png" alt="Explora 1" class="img-fluid w-100 h-100 object-fit-cover rounded-3"/>
                </div>
                <div class="col-3">
                    <img src="img/HOME/image 9.png" alt="Explora 2" class="img-fluid w-100 h-100 object-fit-cover rounded-3"/>
                </div>
                <div class="col-3">
                    <img src="img/HOME/image 8.png" alt="Explora 3" class="img-fluid w-100 h-100 object-fit-cover rounded-3"/>
                </div>
                <div class="col-3">
                    <img src="img/HOME/image 10.png" alt="Explora 4" class="img-fluid w-100 h-100 object-fit-cover rounded-3"/>
                </div>
              </div>
            </div>

            <div class="col-md-2 text-center text-md-end">
              <a href="catalogo.html" class="btn btn-secondary px-4 py-2">
                Ver más ➔
              </a>
            </div>
          </div>
        </div>
      </section>  

      <!-- ================= REDES SOCIALES ================= -->
      <section class="redes-section bg-black text-white py-5">
        <div class="container">
          <div class="row align-items-center">
            
            <div class="col-md-4 mb-4 mb-md-0">
              <h2 class="fw-bold text-uppercase titulo-pesado">Síguenos en redes</h2>
              <!-- DEFENSA: gap-3 separa el logo de Instagram del texto "@rectabags". Si lo quitas, se pegarán. -->
              <div class="d-flex align-items-center gap-3 mb-3 mt-4">
                <a href="https://www.instagram.com/rectabags" target="_blank">
                  <img src="img/RRSS/icons8-instagram-50.png" alt="Instagram" class="icono-nav"/>
                </a>
                <p class="fs-5 m-0">@rectabags</p>
              </div>
              <div class="d-flex align-items-center gap-3">
                <a href="https://www.tiktok.com/@rectabags" target="_blank">
                  <img src="img/RRSS/icons8-tiktok-50.png" alt="TikTok" class="icono-nav"/>
                </a>
                <p class="fs-5 m-0">@rectabags</p>
              </div>
            </div>

            <div class="col-md-8">
              <div class="row g-2">
                <!-- DEFENSA: col-6 (celular = 2 fotos por fila) y col-md-3 (PC = 4 fotos por fila). Esto SÍ es 100% responsivo. -->
                <div class="col-6 col-md-3">
                  <img src="img/RRSS/image 5.png" alt="Instagram 1" class="img-fluid" />
                </div>
                <div class="col-6 col-md-3">
                  <img src="img/RRSS/image 11.png" alt="Instagram 2" class="img-fluid" />
                </div>
                <div class="col-6 col-md-3">
                  <img src="img/RRSS/image 12.png" alt="Instagram 3" class="img-fluid" />
                </div>
                <div class="col-6 col-md-3">
                  <img src="img/RRSS/image 4.png" alt="Instagram 4" class="img-fluid" />
                </div>
              </div>
            </div>
            
          </div>
        </div>
      </section>
    </main>

    <!-- ================= FOOTER ================= -->
    <div id="footer-container"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous">
    </script>  
    <script src="js/logica_rlc.js"></script>

  </body>
</html>
