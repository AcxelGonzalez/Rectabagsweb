<!-- Indica al navegador que este documento está escrito en HTML5 -->
<!doctype html>
<!-- Define el idioma principal de la página como español -->
<html lang="es">
  <head>
    <!-- Define la codificación de caracteres para aceptar tildes y la letra ñ -->
    <meta charset="UTF-8" />
    <!-- CRUCIAL: Obliga a los dispositivos móviles a no alejar el zoom, ajustando el ancho de la web al ancho de la pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El título que aparecerá en la pestaña del navegador -->
    <title>Rectabags - De ciclista para ciclistas</title>

    <!-- Carga Bootstrap 5 desde un servidor externo (CDN). Esto nos da acceso a las clases de layout (grillas, d-flex, paddings) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"/>

    <!-- Enlaza el archivo donde ustedes escribirán su propio CSS para la tipografía, efectos hover y colores específicos -->
    <link rel="stylesheet" href="css/style_header_footer.css" />
    <link rel="stylesheet" href="css/style_home.css" />
    <link rel="stylesheet" href="css/style_menu_lateral.css" />
  </head>
  <body>

    <!-- ================= HEADER / NAVBAR ================= -->
    <div id="header-container">
      <!-- El contenido del encabezado se insertará aquí -->
    </div>

    <main>
      <!-- ================= HERO SECTION ================= -->
      <section class="hero-section d-flex align-items-end">
        <div class="container mb-5">
          <div class="hero-content text-white">
            <h2 class="display-4 fw-bold mb-1">La mochila perfecta</h2>
            <p class="fs-5">para viajar, trabajar y explorar</p>
          </div>
        </div>
      </section>

      <!-- ================= PRODUCTOS ================= -->
      <section class="productos-section py-5">
        <div class="container">
          <h2 class="text-center fw-bold mb-5 text-uppercase titulo-pesado">
            Explora nuestros productos
          </h2>

          <div class="row align-items-center text-center text-md-start">
            <div class="col-md-3 mb-4 mb-md-0">
              <h3 class="fw-bold text-uppercase titulo-pesado lh-sm">
                Selecciona el que mejor se ajuste a tus necesidades
              </h3>
            </div>
            
            <div class="col-md-7 mb-4 mb-md-0">
              <div class="galeria-productos d-flex justify-content-between gap-2">
                <img src="img/explora_1.png" alt="Explora 1" class="img-fluid w-25 object-fit-cover"/>
                <img src="img/explora_2.png" alt="Explora 2" class="img-fluid w-25 object-fit-cover"/>
                <img src="img/explora_3.png" alt="Explora 3" class="img-fluid w-25 object-fit-cover"/>
              </div>
            </div>

            <div class="col-md-2 text-center text-md-end">
              <a href="catalogo.html" class="btn btn-secondary px-4 py-2">
                Ver más ➔
              </a>
            </div>
          </div>
        </div>
      </section>  

      <!-- ================= REDES SOCIALES ================= -->
      <section class="redes-section bg-black text-white py-5">
        <div class="container">
          <div class="row align-items-center">
            
            <div class="col-md-4 mb-4 mb-md-0">
              <h2 class="fw-bold text-uppercase titulo-pesado">Síguenos en redes</h2>
              
              <div class="d-flex align-items-center gap-3 mb-3 mt-4">
                <a href="https://www.instagram.com/rectabags" target="_blank">
                  <img src="img/icons8-instagram-50.png" alt="Instagram" class="icono-nav"/>
                </a>
                <p class="fs-5 m-0">@rectabags</p>
              </div>

              <div class="d-flex align-items-center gap-3">
                <a href="https://www.tiktok.com/@rectabags" target="_blank">
                  <img src="img/icons8-tiktok-50.png" alt="TikTok" class="icono-nav"/>
                </a>
                <p class="fs-5 m-0">@rectabags</p>
              </div>
            </div>

            <div class="col-md-8">
              <div class="row g-2">
                <div class="col-6 col-md-3">
                  <img src="img/explora_1.png" alt="Instagram 1" class="img-fluid" />
                </div>
                <div class="col-6 col-md-3">
                  <img src="img/explora_2.png" alt="Instagram 2" class="img-fluid" />
                </div>
                <div class="col-6 col-md-3">
                  <img src="img/explora_3.png" alt="Instagram 3" class="img-fluid" />
                </div>
                <div class="col-6 col-md-3">
                  <img src="img/explora_4.png" alt="Instagram 4" class="img-fluid" />
                </div>
              </div>
            </div>
            
          </div>
        </div>
      </section>
    </main>

    <!-- ================= FOOTER ================= -->
    <div id="footer-container">
      <!-- El contenido del pie de página se insertará aquí -->
    </div>

    <!-- Carga el JavaScript de Bootstrap. Necesario para que funcione el menú de hamburguesa en celulares  -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous">
    </script>  

    <script src="js/main.js"></script>

  </body>
</html>
