<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Rectabags</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"/>

    <link rel="stylesheet" href="css/style_header_footer.css" />
</head>

<body>

    <!-- ================= HEADER / NAVBAR ================= -->
    <div id="header-container"></div>

    <!-- ================= CONTENIDO DEL PERFIL ================= -->
    <main class="py-5 mt-5">
        <div class="container py-4">
            
            <!-- Título de Bienvenida Dinámico -->
            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="display-5 fw-bold text-dark">Mi Cuenta</h1>
                    <p id="texto-bienvenida" class="text-secondary">Cargando datos...</p>
                </div>
            </div>

            <div class="row g-4">
                <!-- ================= MENÚ LATERAL DEL PERFIL ================= -->
                <div class="col-lg-3">
                    <div class="card border-0 rounded-4 shadow-sm">
                        <div class="list-group list-group-flush rounded-4">
                            <button class="list-group-item list-group-item-action active bg-dark text-white border-dark py-3 fw-bold tab-btn" data-target="seccion-datos">
                                Mis Datos
                            </button>
                            <button class="list-group-item list-group-item-action py-3 tab-btn" data-target="seccion-pedidos">
                                Mis Pedidos
                            </button>
                            <button class="list-group-item list-group-item-action py-3 tab-btn" data-target="seccion-direcciones">
                                Direcciones Guardadas
                            </button>
                            <a href="#" id="btn-logout-perfil" class="list-group-item list-group-item-action text-danger py-3 fw-bold">
                                Cerrar Sesión
                            </a>
                        </div>
                    </div>
                </div>

                <!-- ================= PANEL DE CONTENIDO ================= -->
                <div class="col-lg-9">
                    
                    <!-- SECCIÓN 1: Mis Datos -->
                    <div id="seccion-datos" class="tab-content">
                        <div class="card border-0 rounded-4 shadow-sm p-4">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h2 class="h4 fw-bold m-0">Datos Personales</h2>
                                    <!-- Botones de Edición -->
                                    <div id="acciones-perfil">
                                        <button type="button" id="btn-editar-perfil" class="btn btn-outline-dark btn-sm rounded-pill px-3">Editar</button>
                                        <button type="button" id="btn-cancelar-perfil" class="btn btn-outline-danger btn-sm rounded-pill px-3 d-none">Cancelar</button>
                                        <button type="button" id="btn-guardar-perfil" class="btn btn-dark btn-sm rounded-pill px-3 d-none">Guardar</button>
                                    </div>
                                </div>
                                <form id="form-datos-perfil">
                                    <div class="row g-3">
                                        <!-- Editables -->
                                        <div class="col-md-6">
                                            <label class="form-label small text-secondary fw-bold">Nombre</label>
                                            <input type="text" class="form-control bg-light border-0" id="perfil-nombre" readonly>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small text-secondary fw-bold">Apellido</label>
                                            <input type="text" class="form-control bg-light border-0" id="perfil-apellido" readonly>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small text-secondary fw-bold">RUT</label>
                                            <input type="text" class="form-control bg-light border-0 text-muted" id="perfil-rut" readonly disabled>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small text-secondary fw-bold">Teléfono</label>
                                            <input type="text" class="form-control bg-light border-0" id="perfil-telefono" readonly>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label small text-secondary fw-bold">Correo Electrónico (Solo dominios autorizados)</label>
                                            <input type="email" class="form-control bg-light border-0" id="perfil-email" readonly>
                                        </div>
                                        
                                        <!-- Contraseña (Solo visible al editar) -->
                                        <div class="col-12 d-none campos-password mt-4 border-top pt-3">
                                            <h3 class="h6 fw-bold mb-3">Cambiar Contraseña</h3>
                                            <div class="row g-3">
                                                <div class="col-md-6">
                                                    <label class="form-label small text-secondary fw-bold">Nueva Contraseña</label>
                                                    <input type="password" class="form-control bg-white border-dark" id="perfil-pass-nueva" placeholder="Dejar vacío para no cambiar">
                                                </div>
                                                <div class="col-md-6">
                                                    <label class="form-label small text-secondary fw-bold">Repita Nueva Contraseña</label>
                                                    <input type="password" class="form-control bg-white border-dark" id="perfil-pass-conf" placeholder="Dejar vacío para no cambiar">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN 2: Mis Pedidos -->
                    <div id="seccion-pedidos" class="tab-content d-none">
                        <div class="card border-0 rounded-4 shadow-sm p-4">
                            <div class="card-body">
                                <h2 class="h4 fw-bold mb-4">Historial de Pedidos</h2>
                                <p class="text-secondary">Aún no tienes pedidos registrados en tu cuenta.</p>
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN 3: Direcciones -->
                    <div id="seccion-direcciones" class="tab-content d-none">
                        <div class="card border-0 rounded-4 shadow-sm p-4">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h2 class="h4 fw-bold m-0">Mis Direcciones</h2>
                                    <!-- Botón que abre el modal -->
                                    <button class="btn btn-dark btn-sm rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#modalDireccion">+ Nueva Dirección</button>
                                </div>
                                
                                <!-- Contenedor dinámico donde aparecerán las direcciones -->
                                <div id="contenedor-direcciones">
                                    <p class="text-secondary small">Cargando direcciones...</p>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- ================= MODAL: NUEVA DIRECCIÓN ================= -->
        <div class="modal fade" id="modalDireccion" tabindex="-1" aria-labelledby="modalDireccionLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content rounded-4 border-0 shadow">
                    <div class="modal-header border-bottom-0">
                        <h5 class="modal-title fw-bold" id="modalDireccionLabel">Agregar Dirección</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body pt-0">
                        <form id="form-nueva-direccion">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Nombre (Ej: Casa, Trabajo)</label>
                                <input type="text" class="form-control bg-light border-0" id="nueva-dir-nombre" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Región</label>
                                <select class="form-select bg-light border-0" id="nueva-dir-region" required>
                                    <option value="" selected disabled>Selecciona...</option>
                                    <option value="Región Metropolitana">Región Metropolitana</option>
                                    <option value="Valparaíso">Valparaíso</option>
                                    <option value="Biobío">Biobío</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Ciudad / Comuna</label>
                                <input type="text" class="form-control bg-light border-0" id="nueva-dir-ciudad" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold">Calle y Número</label>
                                <input type="text" class="form-control bg-light border-0" id="nueva-dir-calle" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-bold">Guardar Dirección</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </main>
            </div>
        </div>
    </main>
    
    <!-- ================= FOOTER ================= -->
    <div id="footer-container"></div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>      

    <script src="js/logica_rlc.js"></script>

</body>
</html>
